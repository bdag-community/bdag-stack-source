[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.26"
# BlockDAG mainnet's EVM only enables forks up to London (see
# BdagMainnetChainConfig in bevm/params/config.go), so newer opcodes like
# PUSH0 (Shanghai) are invalid on chain.
evm_version = "london"
optimizer = true
optimizer_runs = 200
